name: Verificação de sintaxe Node.js

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  sintaxe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe do servidor
        run: node --check server.js
